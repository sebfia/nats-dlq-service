name: build-dlq-service

# Pull requests run the container smoke test only. A push to main (or a manual
# run on main) runs it too and, only when it passes, builds, pushes and tags
# the next release.
on:
  push:
    branches:
      - main
    paths: &paths
      - src/DLQService/**
      - src/toolkit
      - global.json
      - paket.dependencies
      - paket.lock
      - .paket/**
      - .config/dotnet-tools.json
      - .github/workflows/build.yml
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

# permissions are needed if pushing to ghcr.io
permissions: 
  packages: write
  contents: write

jobs:
  # Builds the release image (trimmed, single-file, on runtime-deps) and
  # starts it against NATS with a prober already in its network namespace,
  # hitting the probe port before and while the service starts, as the
  # kubelet can (Mercator ADR-0024). The service must come up and answer
  # /alive anyway; a release cannot ship an image that fails this.
  container-smoke:
    name: Container startup smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROBE_URL: http://127.0.0.1:8080/alive
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build image (local only)
        run: docker build -f src/DLQService/Dockerfile -t smoke:local .

      - name: Start NATS, the prober and the service
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name nats --network smoke nats:latest -js
          # holder owns the network namespace that prober and service share,
          # so the prober reaches 127.0.0.1:8080 before the service exists.
          docker run -d --name holder --network smoke busybox:stable sleep 3600
          docker run -d --name prober --network container:holder -e PROBE_URL busybox:stable \
            sh -c 'while true; do wget -q -O /dev/null -T 1 "$PROBE_URL" 2>/dev/null; done'
          sleep 1
          # The image's own Production profile; the DLQ stream defaults to
          # one replica, which the one-node smoke NATS accepts.
          docker run -d --name service --network container:holder \
            -e ConnectionStrings__nats=nats://nats:4222 \
            smoke:local

      - name: Wait for the probe
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if ! docker inspect -f '{{.State.Running}}' service 2>/dev/null | grep -q true; then
              echo "::error::The container exited before /alive answered."
              exit 1
            fi
            if docker exec prober wget -q -O /dev/null -T 2 "$PROBE_URL"; then
              echo "/alive answered after $attempt attempt(s)."
              docker exec prober wget -q -O - -T 2 http://127.0.0.1:8080/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::/alive did not answer within 120 seconds."
          exit 1

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs service 2>&1 || true
          docker rm -f service prober holder nats 2>/dev/null || true
          docker network rm smoke 2>/dev/null || true

  build-dlq-service:

    name: Build DLQ Service

    needs: container-smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
      packages: write
      
    steps:
    - 
      name: Checkout
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: 'recursive' 
    -
      name: Read Version
      id: version
      run: |
        if [ -f ./src/DLQService/VERSION ]; then
          VER=$(cat ./src/DLQService/VERSION | awk -F. -v OFS=. '{$NF += 1 ; print}')
        else
          VER="0.0.1"
        fi
        echo $VER > ./src/DLQService/VERSION
        echo "build_version=$VER" >> $GITHUB_OUTPUT
    -
      # we need qemu and buildx so we can build multiple platforms later
      name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v3
    -
      # BuildKit (used with `docker buildx`) is the best way to build images
      name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - 
      name: BuildAndPush
      uses: docker/build-push-action@v6
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}
        file: ./src/DLQService/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        no-cache: true
        build-args: |
          BUILD_ID=${{ github.run_number }}
          GIT_SHA=${{ github.sha }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/dlqservice:${{ steps.version.outputs.build_version }}
          ghcr.io/${{ github.repository_owner }}/dlqservice:latest
          ghcr.io/${{ github.repository_owner }}/dlqservice:${{ github.sha }}
        labels: |
          org.opencontainers.image.title=DLQ Service
          org.opencontainers.image.description=Dead Letter Queue service for Mercator
          org.opencontainers.image.version=${{ steps.version.outputs.build_version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/main/src/DLQService
    - 
      name: Commit and tag new version and create release
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      env: 
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |        
        t_tag='dlq-service-v${{ steps.version.outputs.build_version }}'
        git config user.name github-actions
        git config user.email github-actions@github.com
        git pull
        
        # Update VERSION file
        git add './src/DLQService/VERSION'
        
        # Update README.md with new version
        sed -i.bak "s|ghcr.io/sebfia/dlqservice:[0-9]*\.[0-9]*\.[0-9-]*|ghcr.io/sebfia/dlqservice:${{ steps.version.outputs.build_version }}|g" README.md
        sed -i.bak "s|# Pull specific version (current: [0-9]*\.[0-9]*\.[0-9-]*)|# Pull specific version (current: ${{ steps.version.outputs.build_version }})|g" README.md
        rm -f README.md.bak
        git add README.md
        
        git commit -m 'Update version for DLQ Service to ${{ steps.version.outputs.build_version }}'
        git push origin main
        git tag -a "$t_tag" -m "Released new version of DLQ Service."
        git push origin "$t_tag"
        gh release create 'dlq-service-${{ steps.version.outputs.build_version }}' \
          -t 'DLQ Service ${{ steps.version.outputs.build_version }}' \
          --generate-notes


